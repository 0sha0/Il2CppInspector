[package]
name = "il2cpp-inspector-gui"
version = "0.1.0"
edition = "2024"
publish = false

# Debug info is the largest part of target/; no build profile keeps it and incremental caches stay off.
[profile.dev]
incremental = false
debug = 0

[profile.dev.build-override]
debug = false

[profile.release]
debug = 0

[profile.release.build-override]
debug = false

[profile.test]
incremental = false
debug = 0

[profile.bench]
debug = 0

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"

# The Windows renderer uses DirectX and DirectWrite; the default features only pull Linux backends (Blade, X11, Wayland).
[target.'cfg(windows)'.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }

[target.'cfg(not(windows))'.dependencies]
gpui = "=0.2.2"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
